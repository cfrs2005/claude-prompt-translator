name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
          bash "$RUNNER_TEMP/claude-install.sh" 2.1.291
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/prompt-translator --strict
      - name: Test translation hooks
        run: claude plugin test plugins/prompt-translator
